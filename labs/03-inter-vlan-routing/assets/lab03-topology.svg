<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900">
  <rect width="1500" height="900" fill="#f8fafc"/>
  <style>
    .t{font:700 36px Arial,sans-serif;fill:#111827}
    .h{font:700 22px Arial,sans-serif;fill:#111827}
    .b{font:18px Arial,sans-serif;fill:#334155}
    .m{font:17px 'Courier New',monospace;fill:#0f172a}
    .box{fill:#ffffff;stroke:#94a3b8;stroke-width:2}
    .router{fill:#fee2e2;stroke:#dc2626;stroke-width:3}
    .switch{fill:#dbeafe;stroke:#2563eb;stroke-width:3}
    .hr{fill:#e0f2fe;stroke:#0284c7;stroke-width:3}
    .sales{fill:#dcfce7;stroke:#16a34a;stroke-width:3}
    .it{fill:#f3e8ff;stroke:#9333ea;stroke-width:3}
    .line{stroke:#334155;stroke-width:4}
    .trunk{stroke:#dc2626;stroke-width:6;stroke-dasharray:12 8}
  </style>
  <text x="60" y="60" class="t">Lab 03 — Inter-VLAN Routing (Router-on-a-Stick)</text>

  <rect x="580" y="110" width="340" height="115" rx="18" class="router"/>
  <text x="710" y="150" class="h">R1</text>
  <text x="620" y="182" class="m">G0/0.10  192.168.10.1</text>
  <text x="620" y="204" class="m">G0/0.20  192.168.20.1</text>
  <text x="620" y="226" class="m">G0/0.30  192.168.30.1</text>

  <rect x="610" y="330" width="280" height="90" rx="16" class="switch"/>
  <text x="715" y="365" class="h">SW1</text>
  <text x="655" y="395" class="b">Fa0/24 = 802.1Q trunk</text>

  <line x1="750" y1="225" x2="750" y2="330" class="trunk"/>
  <text x="785" y="285" class="b">VLANs 10,20,30</text>

  <rect x="80" y="535" width="390" height="230" rx="18" class="hr"/>
  <text x="200" y="575" class="h">VLAN 10 — HR</text>
  <text x="130" y="615" class="b">HR-PC1  192.168.10.10</text>
  <text x="130" y="650" class="b">HR-PC2  192.168.10.20</text>
  <text x="130" y="695" class="m">Gateway: 192.168.10.1</text>

  <rect x="555" y="535" width="390" height="230" rx="18" class="sales"/>
  <text x="650" y="575" class="h">VLAN 20 — SALES</text>
  <text x="605" y="615" class="b">SALES-PC1  192.168.20.10</text>
  <text x="605" y="650" class="b">SALES-PC2  192.168.20.20</text>
  <text x="605" y="695" class="m">Gateway: 192.168.20.1</text>

  <rect x="1030" y="535" width="390" height="230" rx="18" class="it"/>
  <text x="1160" y="575" class="h">VLAN 30 — IT</text>
  <text x="1080" y="615" class="b">IT-PC1  192.168.30.10</text>
  <text x="1080" y="650" class="b">IT-PC2  192.168.30.20</text>
  <text x="1080" y="695" class="m">Gateway: 192.168.30.1</text>

  <line x1="680" y1="420" x2="300" y2="535" class="line"/>
  <line x1="750" y1="420" x2="750" y2="535" class="line"/>
  <line x1="820" y1="420" x2="1225" y2="535" class="line"/>

  <text x="90" y="840" class="b">Traffic between VLANs is routed by R1. The trunk carries tagged frames for VLANs 10, 20, and 30.</text>
</svg>