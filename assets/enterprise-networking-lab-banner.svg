  </defs>

  <rect width="1400" height="420" rx="28" fill="url(#bg)"/>
  <circle cx="1180" cy="90" r="170" fill="#1e293b" opacity="0.75"/>
  <circle cx="1260" cy="340" r="220" fill="#0b1220" opacity="0.75"/>

  <!-- network motif -->
  <g stroke="#334155" stroke-width="3">
